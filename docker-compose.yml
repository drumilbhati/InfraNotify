services:
  postgres:
    image: postgres:16
    container_name: infra-notify-postgres
    environment:
      POSTGRES_DB: mydb
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d mydb"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - /Users/jay/Desktop/InfraNotify/Docker/Data:/var/lib/postgresql/data
